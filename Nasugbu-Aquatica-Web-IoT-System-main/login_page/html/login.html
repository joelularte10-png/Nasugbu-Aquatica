<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquatica | Login</title>
    <link rel="stylesheet" href="../../bootstrap_template/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="login-page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <section class="login-card">
                        <!-- <div class="logo"><img src="business_adds/blogo.jpg" alt=""></div> -->
                        <h1>Welcome back</h1>
                        <p class="subtitle">Sign in to your Aquatica account</p>

                        <form method="POST">
                            <div class="mb-3">
                                <label for="useranem" class="form-label" >Username</label>
                                <input type="text" class="form-control" id="username" placeholder="John Doe" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password">
                            </div>
                            <button type="submit" class="btn login-button w-100" id="loginbtn">Log in</button>
                        </form>

                        <p class="signup-text"><a href="signup.html">Create an account</a></p>
                    </section>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
